
name: Gerar APK BLOCKS RUDS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          mkdir projeto
          unzip -q *.zip -d projeto
          echo "PROJECT_DIR=$(dirname "$(find projeto -name settings.gradle -print -quit)")" >> $GITHUB_ENV

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOCKS-RUDS-APK
          path: projeto/**/app/build/outputs/apk/debug/*.apk
          
